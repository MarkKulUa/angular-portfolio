<div class="resume-page">
  @if (resumeData(); as data) {
    <div class="resume-container">
      <app-resume-header [personalInfo]="data.personalInfo" />
      <app-resume-summary [summary]="data.summary" />
      <app-resume-skills
        [technicalExpertise]="data.technicalExpertise"
        [certifiedSkills]="data.certifiedSkills"
      />
      <app-resume-experience [workHistory]="data.workHistory" />
      <app-resume-education [education]="data.education" />
      <app-resume-certifications [certifications]="data.certifications" />
    </div>
  } @else {
    <div class="loading">Loading resume...</div>
  }
</div>
