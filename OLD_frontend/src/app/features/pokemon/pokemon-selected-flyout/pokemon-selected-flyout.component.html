@if (hasSelected()) {
  <div class="flyout-container" [class.expanded]="isExpanded()">
    <button
      class="flyout-header"
      (click)="toggleExpanded()"
      (keydown.enter)="toggleExpanded()"
      (keydown.space)="toggleExpanded(); $event.preventDefault()"
      type="button"
      [attr.aria-expanded]="isExpanded()"
      aria-label="Toggle selected Pokemon list"
    >
      <div class="header-content">
        <span class="selected-count">{{ selectedCount() }} Selected</span>
        <span class="toggle-icon">{{ isExpanded() ? '▼' : '▲' }}</span>
      </div>
    </button>

    @if (isExpanded()) {
      <div class="flyout-content">
        <div class="selected-list">
          @for (item of getSelectedItems(); track item.pokemon.name) {
            <div class="selected-item">
              <img
                [src]="item.details?.sprites?.front_default || 'https://via.placeholder.com/50'"
                [alt]="item.pokemon.name"
                class="item-image"
              />
              <span class="item-name">{{ item.pokemon.name }}</span>
              <button
                class="remove-button"
                (click)="removeItem(item.pokemon.name)"
                aria-label="Remove"
              >
                ×
              </button>
            </div>
          }
        </div>

        <div class="flyout-actions">
          <button class="action-button download" (click)="downloadCSV()">📥 Download CSV</button>
          <button class="action-button clear" (click)="clearAll()">🗑️ Clear All</button>
        </div>
      </div>
    }
  </div>
}
