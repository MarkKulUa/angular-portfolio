<article class="case" [attr.aria-labelledby]="'case-' + caseStudy().id">
  <p class="case__eyebrow">{{ caseStudy().title }}</p>
  <h3 class="case__headline" [id]="'case-' + caseStudy().id">{{ caseStudy().headline }}</h3>

  <p class="case__result">
    <span class="case__label">Result</span>
    {{ caseStudy().result }}
  </p>

  <details class="case__details">
    <summary>How it was done</summary>
    <dl class="case__body">
      <div class="case__block">
        <dt>Challenge</dt>
        <dd>{{ caseStudy().challenge }}</dd>
      </div>
      <div class="case__block">
        <dt>Approach</dt>
        <dd>{{ caseStudy().approach }}</dd>
      </div>
    </dl>
  </details>

  <app-tag-list [items]="caseStudy().tags" label="Topics" variant="subtle" />
</article>
