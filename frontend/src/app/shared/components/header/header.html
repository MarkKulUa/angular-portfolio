<header class="header">
  <div class="container">
    <nav class="nav" aria-label="Main">
      <a routerLink="/" class="logo" (click)="closeMenu()">
        <span class="logo__mark">MK</span>
        <span class="logo__name">Mark Kulishov</span>
        <span class="visually-hidden">, home</span>
      </a>

      <button
        type="button"
        class="menu-toggle"
        aria-controls="main-menu"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="24" />
        <span class="visually-hidden">{{ menuOpen() ? 'Close menu' : 'Open menu' }}</span>
      </button>

      <div class="menu" id="main-menu" [class.menu--open]="menuOpen()">
        <ul class="nav-links">
          @for (link of links; track link.path) {
            <li>
              <a
                [routerLink]="link.path"
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: link.exact }"
                (click)="closeMenu()"
                >{{ link.label }}</a
              >
            </li>
          }
        </ul>
        <button
          type="button"
          class="cv-button"
          [disabled]="generatingCv()"
          [attr.aria-busy]="generatingCv()"
          (click)="downloadCv.emit(); closeMenu()"
        >
          <app-icon name="download" [size]="18" />
          {{ generatingCv() ? 'Preparing…' : 'Download CV' }}
        </button>
      </div>
    </nav>
  </div>
</header>
