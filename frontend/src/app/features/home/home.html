@let data = profile();

<app-home-hero
  [person]="data.person"
  [headline]="data.headline"
  [generatingCv]="cvPdf.generating()"
  (downloadCv)="cvPdf.download()"
/>

<app-section id="impact" eyebrow="Impact" title="Results in numbers">
  <ul class="metrics">
    @for (metric of data.impactMetrics; track metric.label) {
      <li><app-metric-tile [metric]="metric" /></li>
    }
  </ul>
</app-section>

<app-section
  id="career"
  eyebrow="Career path"
  title="From engineer to engineering leader"
  lead="15+ years at PrivatBank, the last 4+ in people management."
  [muted]="true"
>
  <app-career-timeline [roles]="data.experience[0].roles" [next]="data.headline.role" />
</app-section>

<app-section id="case-studies" eyebrow="Case studies" title="How I solved real delivery problems">
  <ul class="cases">
    @for (caseStudy of data.caseStudies; track caseStudy.id) {
      <li><app-case-card [caseStudy]="caseStudy" /></li>
    }
  </ul>
</app-section>

<app-section id="how-i-lead" eyebrow="Leadership" title="How I lead" [muted]="true">
  <app-leadership-principles [principles]="data.principles" />
</app-section>

<app-contact-cta
  [person]="data.person"
  [generatingCv]="cvPdf.generating()"
  (downloadCv)="cvPdf.download()"
/>
