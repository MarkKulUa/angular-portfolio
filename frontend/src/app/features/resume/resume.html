<div class="resume-page">
  @let data = profile();
  <div class="resume-layout">
    <app-resume-toc class="resume-toc no-print" />
    <article class="resume-container">
      <app-resume-header
        [person]="data.person"
        [headline]="data.headline"
        [generatingCv]="cvPdf.generating()"
        [cvError]="cvPdf.error()"
        (downloadCv)="cvPdf.download()"
      />
      <app-resume-summary [summary]="data.summary" [languages]="data.languages" />
      <app-resume-competencies [competencies]="data.competencies" />
      <app-resume-experience [experience]="data.experience" />
      <app-resume-projects [projects]="data.independentProjects" />
      <app-resume-education [education]="data.education" />
      <app-resume-certifications
        [certifications]="data.certifications"
        [credlyUrl]="data.person.links.credly"
      />
    </article>
  </div>
</div>
