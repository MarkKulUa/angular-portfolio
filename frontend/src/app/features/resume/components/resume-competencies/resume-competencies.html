<section class="resume-section" id="competencies" aria-labelledby="competencies-title">
  <div class="content">
    <h2 class="section-title" id="competencies-title">Core Competencies</h2>
    <dl class="groups">
      @for (group of competencies(); track group.title) {
        <div class="group">
          <dt class="group__title">{{ group.title }}</dt>
          <dd class="group__items">
            {{ group.items.join(', ') }}
            @if (group.extra; as extra) {
              <span class="group__extra"
                ><strong>{{ extra.label }}:</strong> {{ extra.items.join(', ') }}</span
              >
            }
          </dd>
        </div>
      }
    </dl>
  </div>
</section>
