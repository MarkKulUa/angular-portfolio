<section class="resume-section" aria-labelledby="education-title">
  <div class="content">
    <h2 class="section-title" id="education-title">Education</h2>
    @for (edu of education(); track edu.institution) {
      <div class="education">
        <h3 class="education__institution">{{ edu.institution }}</h3>
        <p>{{ edu.degree }}</p>
        <p class="education__specialization">“{{ edu.specialization }}”</p>
        <p class="meta">{{ edu.period | period }}</p>
      </div>
    }
  </div>
</section>
