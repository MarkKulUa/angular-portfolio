<header class="resume-header">
  <div class="profile">
    <div class="profile__photo">
      @if (!photoFailed()) {
        <img
          class="avatar"
          [ngSrc]="person().photo"
          [alt]="'Photo of ' + person().name"
          width="104"
          height="104"
          priority
          (error)="photoFailed.set(true)"
        />
      } @else {
        <div class="avatar avatar--initials" aria-hidden="true">{{ person().name.charAt(0) }}</div>
      }
    </div>

    <div class="profile__info">
      <h1 class="name">{{ person().name }}</h1>
      <p class="role">{{ headline().role }}</p>
      <p class="tagline">
        @for (item of headline().tagline; track item; let last = $last) {
          <span>{{ item }}</span>
          @if (!last) {
            <span class="sep" aria-hidden="true">·</span>
          }
        }
      </p>
      <p class="location">
        <app-icon name="map-pin" [size]="16" />
        {{ person().location }} · {{ person().workFormat }}
      </p>
    </div>
  </div>

  <div class="actions no-print">
    <app-contact-links [links]="person().links" variant="on-brand" />
    <button
      type="button"
      class="btn-download"
      [disabled]="generatingCv()"
      [attr.aria-busy]="generatingCv()"
      (click)="downloadCv.emit()"
    >
      <app-icon name="download" [size]="18" />
      {{ generatingCv() ? 'Preparing…' : 'Download CV (PDF)' }}
    </button>
  </div>
  @if (cvError()) {
    <p class="cv-error no-print" role="status">{{ cvError() }}</p>
  }
</header>
